<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f0">
    <title>Daymark — A quieter to-do list</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f6f0;
        --ink: #20231f;
        --muted: #777a71;
        --line: #e6e5dc;
        --green: #315b43;
        --green-soft: #e7ede5;
        --coral: #c7624c;
        --serif: Georgia, "Times New Roman", serif;
        --sans: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(#d9d8ce 0.65px, transparent 0.65px);
        background-size: 17px 17px;
        font-family: var(--sans);
      }

      button, input { font: inherit; }
      button { color: inherit; }

      .page {
        width: min(100% - 40px, 720px);
        margin: 0 auto;
        padding: 34px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 23px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      .mark {
        display: grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: var(--green);
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 400;
      }

      .local-note {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }

      .local-note::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #739477;
        content: "";
      }

      main { padding-top: 54px; }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(38px, 8vw, 58px);
        font-weight: 400;
        line-height: 1.06;
      }

      .intro {
        margin: 15px 0 35px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .entry-form {
        display: flex;
        gap: 10px;
        padding: 8px;
        border: 1px solid #deded4;
        border-radius: 5px;
        background: #fffefa;
        box-shadow: 0 5px 18px #34372b0a;
      }

      .entry-form input {
        width: 100%;
        min-width: 0;
        padding: 12px 11px;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 14px;
      }

      .entry-form input::placeholder { color: #9a9b92; }

      .entry-form:focus-within {
        border-color: #819985;
        box-shadow: 0 0 0 3px #315b4317;
      }

      .add-button {
        flex: 0 0 auto;
        padding: 0 18px;
        border: 0;
        border-radius: 3px;
        color: white;
        background: var(--green);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        transition: background 150ms ease, transform 150ms ease;
      }

      .add-button:hover { background: #254a35; }
      .add-button:active { transform: translateY(1px); }

      .list-heading {
        display: flex;
        min-height: 68px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        border-bottom: 1px solid var(--line);
      }

      .filters {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .filter-button {
        padding: 8px 10px;
        border: 0;
        border-radius: 3px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
      }

      .filter-button:hover { color: var(--ink); }
      .filter-button[aria-pressed="true"] {
        color: var(--green);
        background: var(--green-soft);
        font-weight: 700;
      }

      .task-count {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }

      .task-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-row {
        display: grid;
        min-height: 64px;
        grid-template-columns: 22px minmax(0, 1fr) 34px;
        gap: 13px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        animation: appear 180ms ease both;
      }

      .task-check {
        width: 19px;
        height: 19px;
        margin: 0;
        accent-color: var(--green);
        cursor: pointer;
      }

      .task-text {
        overflow-wrap: anywhere;
        font-size: 14px;
        line-height: 1.5;
      }

      .task-row.is-complete .task-text {
        color: #96978f;
        text-decoration: line-through;
        text-decoration-color: #a9aaa1;
      }

      .delete-button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 0;
        border-radius: 3px;
        color: #92938a;
        background: transparent;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
      }

      .delete-button:hover { color: var(--coral); background: #c7624c12; }

      .empty-state {
        padding: 45px 12px 48px;
        color: var(--muted);
        text-align: center;
        font-family: var(--serif);
        font-size: 19px;
      }

      .empty-state[hidden] { display: none; }

      .list-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 17px;
        color: var(--muted);
        font-size: 11px;
      }

      .clear-button {
        padding: 0;
        border: 0;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 11px;
      }

      .clear-button:hover:not(:disabled) { color: var(--coral); }
      .clear-button:disabled { cursor: default; opacity: 0.45; }

      @keyframes appear {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 480px) {
        .page { width: min(100% - 32px, 720px); padding-top: 22px; }
        main { padding-top: 43px; }
        .intro { margin-bottom: 27px; }
        .local-note { font-size: 11px; }
        .list-heading { min-height: 62px; }
        .filter-button { padding: 8px 7px; }
        .list-footer { font-size: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="wordmark"><span class="mark" aria-hidden="true">d</span> DAYMARK</div>
        <span class="local-note">Saved on this device</span>
      </header>

      <main>
        <p class="eyebrow">A little more room to think</p>
        <h1>Make room for<br>what matters.</h1>
        <p class="intro">One thing at a time. Your list stays right here in this browser.</p>

        <form class="entry-form" id="task-form">
          <input id="task-input" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
          <button class="add-button" type="submit">Add task</button>
        </form>

        <section aria-label="Your tasks">
          <div class="list-heading">
            <div class="filters" role="group" aria-label="Filter tasks">
              <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
              <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
              <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
            </div>
            <span class="task-count" id="task-count" aria-live="polite">0 tasks</span>
          </div>
          <ul class="task-list" id="task-list"></ul>
          <p class="empty-state" id="empty-state">A fresh page. Add your first task above.</p>
          <div class="list-footer">
            <span id="remaining-count">Nothing on your list yet</span>
            <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "daymark-tasks-v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const emptyState = document.querySelector("#empty-state");
      const taskCount = document.querySelector("#task-count");
      const remainingCount = document.querySelector("#remaining-count");
      const clearCompletedButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];

      let tasks = loadTasks();
      let currentFilter = "all";

      function loadTasks() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(stored)
            ? stored.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
            : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          remainingCount.textContent = "Storage unavailable in this browser";
        }
      }

      function visibleTasks() {
        if (currentFilter === "active") return tasks.filter((task) => !task.completed);
        if (currentFilter === "completed") return tasks.filter((task) => task.completed);
        return tasks;
      }

      function render() {
        list.replaceChildren();

        for (const task of visibleTasks()) {
          const item = document.createElement("li");
          item.className = `task-row${task.completed ? " is-complete" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "task-check";
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `Mark ${task.text} ${task.completed ? "to do" : "done"}`);
          checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.textContent = "×";
          deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
          deleteButton.title = "Delete task";
          deleteButton.addEventListener("click", () => {
            tasks = tasks.filter((entry) => entry.id !== task.id);
            saveTasks();
            render();
          });

          item.append(checkbox, text, deleteButton);
          list.append(item);
        }

        const completed = tasks.filter((task) => task.completed).length;
        const remaining = tasks.length - completed;
        taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
        remainingCount.textContent = tasks.length === 0
          ? "Nothing on your list yet"
          : `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        clearCompletedButton.disabled = completed === 0;
        emptyState.hidden = visibleTasks().length > 0;
        emptyState.textContent = tasks.length === 0
          ? "A fresh page. Add your first task above."
          : currentFilter === "active"
            ? "All caught up. Nothing left to do."
            : "No completed tasks just yet.";

        for (const button of filterButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }

        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        currentFilter = "all";
        saveTasks();
        render();
        input.value = "";
        input.focus();
      });

      for (const button of filterButtons) {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          render();
        });
      }

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      render();
    </script>
  </body>
</html>
